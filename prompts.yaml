    \ of LiLi’s guessing mechanism and continual learning ability that help in achieving avg. +ve F1 of 0.57 and 0.62 on FB\
    \ and WN respectively with minimal participation of the user.\nConclusion\nIn this paper, we are interested in building\
    \ a generic engine for continuous knowledge learning in human-machine conversations. We first showed that the problem\
    \ underlying the engine can be formulated as an open-world knowledge base completion (OKBC) problem. We then proposed\
    \ an lifelong interactive learning and inference (LiLi) approach to solving the OKBC problem. OKBC is a generalization\
    \ of KBC. LiLi solves the OKBC problem by first formulating a query-specific inference strategy using RL and then executing\
    \ it to solve the problem by interacting with the user in a lifelong learning manner. Experimental results showed the\
    \ effectiveness of LiLi in terms of both predictive quality and strategy formulation ability. We believe that a system\
