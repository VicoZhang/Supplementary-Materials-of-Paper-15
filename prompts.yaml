  text: "You are given a scientific article and a question. Answer the question as concisely as you can, using a single phrase\
    \ or sentence if possible. If the question cannot be answered based on the information in the article, write \"unanswerable\"\
    . If the question is a yes/no question, answer \"yes\", \"no\", or \"unanswerable\". Do not provide any explanation.\n\
    \nArticle: Introduction\nChatbots such as dialog and question-answering systems have a long history in AI and natural\
    \ language processing. Early such systems were mostly built using markup languages such as AIML, handcrafted conversation\
    \ generation rules, and/or information retrieval techniques BIBREF0 , BIBREF1 , BIBREF2 , BIBREF3 . Recent neural conversation\
    \ models BIBREF4 , BIBREF5 , BIBREF6 are even able to perform open-ended conversations. However, since they do not use\
    \ explicit knowledge bases and do not perform inference, they often suffer from generic and dull responses BIBREF5 , BIBREF7\
    \ . More recently, BIBREF8 and BIBREF9 proposed to use knowledge bases (KBs) to help generate responses for knowledge-grounded\
    \ conversation. However, one major weakness of all existing chat systems is that they do not explicitly or implicitly\
    \ learn new knowledge in the conversation process. This seriously limits the scope of their applications. In contrast,\
    \ we humans constantly learn new knowledge in our conversations. Even if some existing systems can use very large knowledge\
    \ bases either harvested from a large data source such as the Web or built manually, these KBs still miss a large number\
    \ of facts (knowledge) BIBREF10 . It is thus important for a chatbot to continuously learn new knowledge in the conversation\
    \ process to expand its KB and to improve its conversation ability.\nIn recent years, researchers have studied the problem\
    \ of KB completion, i.e., inferring new facts (knowledge) automatically from existing facts in a KB. KB completion (KBC)\
    \ is defined as a binary classification problem: Given a query triple, ( INLINEFORM0 , INLINEFORM1 , INLINEFORM2 ), we\
    \ want to predict whether the source entity INLINEFORM3 and target entity INLINEFORM4 can be linked by the relation INLINEFORM5\
    \ . However, existing approaches BIBREF11 , BIBREF12 , BIBREF13 , BIBREF14 , BIBREF15 , BIBREF16 solve this problem under\
    \ the closed-world assumption, i.e., INLINEFORM6 , INLINEFORM7 and INLINEFORM8 are all known to exist in the KB. This\
    \ is a major weakness because it means that no new knowledge or facts may contain unknown entities or relations. Due to\
    \ this limitation, KBC is clearly not sufficient for knowledge learning in conversations because in a conversation, the\
    \ user can say anything, which may contain entities and relations that are not already in the KB.\nIn this paper, we remove\
    \ this assumption of KBC, and allow all INLINEFORM0 , INLINEFORM1 and INLINEFORM2 to be unknown. We call the new problem\
    \ open-world knowledge base completion (OKBC). OKBC generalizes KBC. Below, we show that solving OKBC naturally provides\
    \ the ground for knowledge learning and inference in conversations. In essence, we formulate an abstract problem of knowledge\
    \ learning and inference in conversations as a well-defined OKBC problem in the interactive setting.\nFrom the perspective\
    \ of knowledge learning in conversations, essentially we can extract two key types of information, true facts and queries,\
    \ from the user utterances. Queries are facts whose truth values need to be determined. Note that we do not study fact\
    \ or relation extraction in this paper as there is an extensive work on the topic. (1) For a true fact, we will incorporate\
    \ it into the KB. Here we need to make sure that it is not already in the KB, which involves relation resolution and entity\
    \ linking. After a fact is added to the KB, we may predict that some related facts involving some existing relations in\
    \ the KB may also be true (not logical implications as they can be automatically inferred). For example, if the user says\
    \ “Obama was born in USA,” the system may guess that (Obama, CitizenOf, USA) (meaning that Obama is a citizen of USA)\
    \ could also be true based on the current KB. To verify this fact, it needs to solve a KBC problem by treating (Obama,\
    \ CitizenOf, USA) as a query. This is a KBC problem because the fact (Obama, BornIn, USA) extracted from the original\
    \ sentence has been added to the KB. Then Obama and USA are in the KB. If the KBC problem is solved, it learns a new fact\
    \ (Obama, CitizenOf, USA) in addition to the extracted fact (Obama, BornIn, USA). (2) For a query fact, e.g., (Obama,\
    \ BornIn, USA) extracted from the user question “Was Obama born in USA?” we need to solve the OKBC problem if any of “Obama,\
    \ “BornIn”, or “USA\" is not already in the KB.\nWe can see that OKBC is the core of a knowledge learning engine for conversation.\
    \ Thus, in this paper, we focus on solving it. We assume that other tasks such as fact/relation extraction and resolution\
    \ and guessing of related facts of an extracted fact are solved by other sub-systems.\nWe solve the OKBC problem by mimicking\
    \ how humans acquire knowledge and perform reasoning in an interactive conversation. Whenever we encounter an unknown\
    \ concept or relation while answering a query, we perform inference using our existing knowledge. If our knowledge does\
    \ not allow us to draw a conclusion, we typically ask questions to others to acquire related knowledge and use it in inference.\
    \ The process typically involves an inference strategy (a sequence of actions), which interleaves a sequence of processing\
    \ and interactive actions. A processing action can be the selection of related facts, deriving inference chain, etc.,\
    \ that advances the inference process. An interactive action can be deciding what to ask, formulating a suitable question,\
    \ etc., that enable us to interact. The process helps grow the knowledge over time and the gained knowledge enables us\
    \ to communicate better in the future. We call this lifelong interactive learning and inference (LiLi). Lifelong learning\
    \ is reflected by the facts that the newly acquired facts are retained in the KB and used in inference for future queries,\
    \ and that the accumulated knowledge in addition to the updated KB including past inference performances are leveraged\
    \ to guide future interaction and learning. LiLi should have the following capabilities:\nThis setting is ideal for many\
    \ NLP applications like dialog and question-answering systems that naturally provide the scope for human interaction and\
    \ demand real-time inference.\nLiLi starts with the closed-world KBC approach path-ranking (PR) BIBREF11 , BIBREF17 and\
    \ extends KBC in a major way to open-world knowledge base completion (OKBC). For a relation INLINEFORM0 , PR works by\
    \ enumerating paths (except single-link path INLINEFORM1 ) between entity-pairs linked by INLINEFORM2 in the KB and use\
    \ them as features to train a binary classifier to predict whether a query INLINEFORM3 should be in the KB. Here, a path\
    \ between two entities is a sequence of relations linking them. In our work, we adopt the latest PR method, C-PR BIBREF16\
    \ and extend it to make it work in the open-world setting. C-PR enumerates paths by performing bidirectional random walks\
    \ over the KB graph while leveraging the context of the source-target entity-pair. We also adopt and extend the compositional\
    \ vector space model BIBREF20 , BIBREF21 with continual learning capability for prediction.\nGiven an OKBC query ( INLINEFORM0\
    \ , INLINEFORM1 , INLINEFORM2 ) (e.g., “(Obama, CitizenOf, USA), which means whether Obama a citizen of USA), LiLi interacts\
    \ with the user (if needed) by dynamically formulating questions (see the interaction example in Figure 1, which will\
    \ be further explained in §3) and leverages the interactively acquired knowledge (supporting facts (SFs) in the figure)\
    \ for continued inference. To do so, LiLi formulates a query-specific inference strategy and executes it. We design LiLi\
    \ in a Reinforcement Learning (RL) setting that performs sub-tasks like formulating and executing strategy, training a\
    \ prediction model for inference, and knowledge retention for future use. To the best of our knowledge, our work is the\
    \ first to address the OKBC problem and to propose an interactive learning mechanism to solve it in a continuous or lifelong\
    \ manner. We empirically verify the effectiveness of LiLi on two standard real-world KBs: Freebase and WordNet. Experimental\
    \ results show that LiLi is highly effective in terms of its predictive performance and strategy formulation ability.\n\
    Related Work\nTo the best of our knowledge, we are not aware of any knowledge learning system that can learn new knowledge\
    \ in the conversation process. This section thus discusses other related work.\nAmong existing KB completion approaches,\
    \ BIBREF20 extended the vector space model for zero-shot KB inference. However, the model cannot handle unknown entities\
    \ and can only work on fixed set of unknown relations with known embeddings. Recently, BIBREF22 proposed a method using\
    \ external text corpus to perform inference on unknown entities. However, the method cannot handle unknown relations.\
    \ Thus, these methods are not suitable for our open-world setting. None of the existing KB inference methods perform interactive\
    \ knowledge learning like LiLi. NELL BIBREF23 continuously updates its KB using facts extracted from the Web. Our task\
    \ is very different as we do not do Web fact extraction (which is also useful). We focus on user interactions in this\
    \ paper. Our work is related to interactive language learning (ILL) BIBREF24 , BIBREF25 , but these are not about KB completion.\
    \ The work in BIBREF26 allows a learner to ask questions in dialogue. However, this work used RL to learn about whether\
    \ to ask the user or not. The “what to ask aspect\" was manually designed by modeling synthetic tasks. LiLi formulates\
    \ query-specific inference strategies which embed interaction behaviors. Also, no existing dialogue systems BIBREF4 ,\
    \ BIBREF27 , BIBREF28 , BIBREF29 , BIBREF30 employ lifelong learning to train prediction models by using information/knowledge\
    \ retained in the past.\nOur work is related to general lifelong learning in BIBREF31 , BIBREF32 , BIBREF33 , BIBREF34\
    \ , BIBREF35 , BIBREF36 . However, they learn only one type of tasks, e.g., supervised, topic modeling or reinforcement\
    \ learning (RL) tasks. None of them is suitable for our setting, which involves interleaving of RL, supervised and interactive\
    \ learning. More details about lifelong learning can be found in the book BIBREF31 .\nInteractive Knowledge Learning (LiLi)\n\
    We design LiLi as a combination of two interconnected models: (1) a RL model that learns to formulate a query-specific\
    \ inference strategy for performing the OKBC task, and (2) a lifelong prediction model to predict whether a triple should\
    \ be in the KB, which is invoked by an action while executing the inference strategy and is learned for each relation\
    \ as in C-PR. The framework improves its performance over time through user interaction and knowledge retention. Compared\
    \ to the existing KB inference methods, LiLi overcomes the following three challenges for OKBC:\n1. Mapping open-world\
    \ to close-world. Being a closed-world method, C-PR cannot extract path features and learn a prediction model when any\
    \ of INLINEFORM0 , INLINEFORM1 or INLINEFORM2 is unknown. LiLi solves this problem through interactive knowledge acquisition.\
    \ If INLINEFORM3 is unknown, LiLi asks the user to provide a clue (an example of INLINEFORM4 ). And if INLINEFORM5 or\
    \ INLINEFORM6 is unknown, LiLi asks the user to provide a link (relation) to connect the unknown entity with an existing\
    \ entity (automatically selected) in the KB. We refer to such a query as a connecting link query (CLQ). The acquired knowledge\
    \ reduces OKBC to KBC and makes the inference task feasible.\n2. Spareseness of KB. A main issue of all PR methods like\
    \ C-PR is the connectivity of the KB graph. If there is no path connecting INLINEFORM0 and INLINEFORM1 in the graph, path\
    \ enumeration of C-PR gets stuck and inference becomes infeasible. In such cases, LiLi uses a template relation (“@-?-@\"\
    ) as the missing link marker to connect entity-pairs and continues feature extraction. A path containing “@-?-@\" is called\
    \ an incomplete path. Thus, the extracted feature set contains both complete (no missing link) and incomplete paths. Next,\
    \ LiLi selects an incomplete path from the feature set and asks the user to provide a link for path completion. We refer\
    \ to such a query as missing link query (MLQ).\n3. Limitation in user knowledge. If the user is unable to respond to MLQs\
    \ or CLQs, LiLi uses a guessing mechanism (discussed later) to fill the gap. This enables LiLi to continue its inference\
    \ even if the user cannot answer a system question.\nComponents of LiLi\nAs lifelong learning needs to retain knowledge\
    \ learned from past tasks and use it to help future learning BIBREF31 , LiLi uses a Knowledge Store (KS) for knowledge\
    \ retention. KS has four components: (i) Knowledge Graph ( INLINEFORM0 ): INLINEFORM1 (the KB) is initialized with base\
